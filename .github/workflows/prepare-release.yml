name: Prepare release

on:
  workflow_dispatch:
    inputs:
      mod:
        description: Mod to package
        required: true
        type: choice
        options:
          - VerdantStamina
      tag:
        description: Existing tag (VerdantStamina/vX.Y.Z or prerelease)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.mod }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_MOD: ${{ inputs.mod }}
    steps:
      - name: Validate request
        env:
          SELECTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:SELECTED_REF -ne "refs/heads/$env:DEFAULT_BRANCH") { throw 'Run from the default branch.' }
          if ($env:RELEASE_MOD -cne 'VerdantStamina') { throw 'Unsupported mod.' }
          if ($env:RELEASE_TAG -cnotmatch '^VerdantStamina/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag.' }
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r mods/VerdantStamina/dev/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          New-Item -ItemType Directory -Path build -Force | Out-Null
      - name: Test, package and validate
        run: |
          python mods/VerdantStamina/dev/test_mod.py
          if ($LASTEXITCODE -ne 0) { throw 'Lua tests failed.' }
          python mods/VerdantStamina/dev/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          python mods/VerdantStamina/dev/check_release.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed.' }
          python mods/VerdantStamina/dev/test_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release validator tests failed.' }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $existing = gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing releases.' }
          if ($env:RELEASE_TAG -cin @($existing)) { throw 'Release or draft already exists for this tag.' }
          $version = $env:RELEASE_TAG.Substring('VerdantStamina/v'.Length)
          $archive = "dist/VerdantStamina-$version.zip"
          $releaseArgs = @('release','create',$env:RELEASE_TAG,$archive,'--verify-tag','--draft','--title',"Verdant Stamina $version",'--notes-file','mods/VerdantStamina/release_notes.md')
          if ($version.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed. Inspect Releases before retrying.' }
